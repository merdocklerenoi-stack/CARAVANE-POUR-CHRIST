<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Application Identity -->
    <title>CARAVANE POUR CHRIST — 365 jours avec Dieu</title>
    <meta name="description" content="Application chrétienne de méditations quotidiennes '365 jours avec Dieu'. Un jour à la fois, plus près de Christ." />
    
    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="CARAVANE POUR CHRIST — 365 jours avec Dieu" />
    <meta property="og:description" content="Un jour à la fois, plus près de Christ. Méditations bibliques, prières, réflexions et verset du jour." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CARAVANE POUR CHRIST" />
    <meta name="twitter:description" content="Méditations quotidiennes chrétiennes : 365 jours avec Dieu." />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0E2044" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Caravane" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />

    <!-- Typography: Cormorant Garamond (refined spiritual serif) & Outfit (clean modern sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F4F7FC] text-[#0F1E36] antialiased selection:bg-[#2563EB]/20 selection:text-[#1E40AF] dark:bg-[#070E1E] dark:text-[#E2E8F0]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Enregistrement du Service Worker pour PWA et Notifications en arrière-plan
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[Caravane PWA] Service Worker enregistré avec succès:', reg.scope);
              // Demander synchronisation périodique si supporté
              if ('periodicSync' in reg) {
                reg.periodicSync.register('daily-verse-sync', {
                  minInterval: 12 * 60 * 60 * 1000 // Toutes les 12 heures
                }).catch(err => console.log('[PWA] PeriodicSync non disponible:', err));
              }
            })
            .catch(err => console.warn('[Caravane PWA] Erreur enregistrement SW:', err));
        });
      }
    </script>
  </body>
</html>
